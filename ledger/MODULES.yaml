project_shape:
  scale: multi-subsystem
  has_subsystem_layer: true
  expected_modules: "7-10"
  kind: product

modules:
  - id: healthtracker.shared-app-shell.navigation-shell
    project: HealthTracker
    subsystem: Shared App Shell
    name: Navigation Shell
    capability: Launches the app, wires Core Data into SwiftUI, and exposes the main tabbed navigation.
    status: working
    approach: Uses a SwiftUI `App` entrypoint plus a `TabView`, with UIKit tab bar appearance customization and startup-time data bootstrapping.
    tech: [SwiftUI, CoreData, UIKit, NotificationCenter, UserDefaults]
    io:
      in: app lifecycle events and user tab selections
      out: root navigation, configured managed object context, and initial symptom bootstrap/update actions
    code_refs:
      - HealthTracker/HealthTrackerApp.swift
      - HealthTracker/ContentView.swift
    known_gaps:
      - Sleep tracking has a dedicated screen (`SleepTrackingView`) but the main tab bar does not expose it.
      - Startup behavior depends on `onAppear` side effects and debug-print driven checks rather than a dedicated initialization flow.
    match_keywords: [swiftui app shell, tab navigation, app bootstrap, root view composition, ios entrypoint]

  - id: healthtracker.shared-data-persistence.core-data-store
    project: HealthTracker
    subsystem: Shared Data Persistence
    name: Core Data Store
    capability: Defines the local data model and persists daily, period, sleep, lifestyle, and symptom records.
    status: partial
    approach: Builds the Core Data model programmatically in code, saves through a singleton `NSPersistentContainer`, and stores some structured fields as plain strings or JSON text.
    tech: [CoreData, Foundation, NSPersistentContainer, NSManagedObject, JSONEncoder, JSONDecoder]
    io:
      in: SwiftUI feature state and save/update requests
      out: persisted `DailyEntry`, `PeriodEntry`, `SleepEntry`, `LifestyleEntry`, `PredefinedSymptom`, and `SymptomRating` records
    code_refs:
      - HealthTracker/CoreDataStack.swift
      - HealthTracker/DailyTrackingView.swift
      - HealthTracker/SleepTrackingView.swift
      - HealthTracker/PeriodTrackingView.swift
      - HealthTracker/SymptomDataManager.swift
    known_gaps:
      - The schema is defined entirely in code, with no visible migration path or model versioning.
      - Several structured concepts are serialized into `notes` or string fields instead of typed attributes or relationships.
      - Sleep quality is written with inconsistent scales across flows, which makes stored data semantics unstable.
    match_keywords: [core data persistence, local datastore, offline health records, programmatic schema, ios storage layer]

  - id: healthtracker.symptom-management.symptom-catalog
    project: HealthTracker
    subsystem: Symptom Management
    name: Symptom Catalog
    capability: Seeds, updates, groups, and filters the predefined symptom list used for daily symptom tracking.
    status: partial
    approach: Keeps a hard-coded symptom catalog in a singleton manager, stores active/inactive state in Core Data, and groups symptoms by category for UI rendering.
    tech: [CoreData, Foundation, UserDefaults]
    io:
      in: first-run bootstrap checks, symptom rename rules, and symptom activation toggles
      out: persisted symptom catalog records and grouped active symptom collections
    code_refs:
      - HealthTracker/SymptomDataManager.swift
      - HealthTracker/ContentView.swift
      - DesignSystem.swift
    known_gaps:
      - The predefined catalog is hard-coded around migraine and post-concussion symptoms even though the project is documented as a broader women's health tracker.
      - Catalog migrations are managed with a one-off `UserDefaults` flag rather than versioned data migration logic.
      - Category definitions and labels are embedded in code rather than editable data.
    match_keywords: [symptom library, symptom taxonomy, symptom seeding, symptom catalog management, health symptom tracker]

  - id: healthtracker.symptom-management.daily-entry-workflow
    project: HealthTracker
    subsystem: Symptom Management
    name: Daily Entry Workflow
    capability: Captures a day's symptoms, notes, tags, sleep inputs, and lifestyle inputs from a single consolidated entry screen.
    status: partial
    approach: Uses a large SwiftUI form composed from reusable design-system components, then fans out saves to symptom, sleep, and lifestyle records in Core Data.
    tech: [SwiftUI, CoreData, Foundation, UserDefaults]
    io:
      in: selected date, symptom ratings, notes, tags, sleep values, lifestyle values, medications, and triggers
      out: "`DailyEntry`, `SymptomRating`, `SleepEntry`, and `LifestyleEntry` updates for the selected day"
    code_refs:
      - HealthTracker/DailyTrackingView.swift
      - HealthTracker/SymptomDataManager.swift
      - DesignSystem.swift
    known_gaps:
      - The screen mixes multiple domains and persistence flows in one file, making the workflow large and tightly coupled.
      - Sleep quality is saved here on a different scale than in the standalone sleep screen.
      - Tags are embedded into the daily notes text instead of being modeled as first-class data.
      - Lifestyle intake labels are parsed back out of notes text on reload instead of being reconstructed from typed fields alone.
    match_keywords: [daily health log, symptom journal, combined intake form, daily tracking workflow, health diary]

  - id: healthtracker.sleep-tracking.sleep-log
    project: HealthTracker
    subsystem: Sleep Tracking
    name: Sleep Log
    capability: Records sleep duration, quality, disturbances, notes, and recent sleep trends in a dedicated sleep screen.
    status: partial
    approach: Uses SwiftUI sections with sliders and toggle chips, then stores per-day sleep entries in Core Data with disturbances JSON-encoded into a string field.
    tech: [SwiftUI, CoreData, Foundation, JSONEncoder, JSONDecoder]
    io:
      in: selected date, hours slept, sleep quality, disturbance selections, and notes
      out: persisted `SleepEntry` records and recent-sleep summaries
    code_refs:
      - HealthTracker/SleepTrackingView.swift
      - HealthTracker/CoreDataStack.swift
      - DesignSystem.swift
    known_gaps:
      - The dedicated sleep tracker is not linked from the main tab shell.
      - It stores sleep quality on a different numeric scale than the daily-entry sleep save path.
      - Disturbances are stored as encoded text rather than normalized related records.
    match_keywords: [sleep tracker, sleep journal, sleep quality logging, sleep disturbance tracking, sleep diary]

  - id: healthtracker.period-tracking.period-log-and-cycle-estimation
    project: HealthTracker
    subsystem: Period Tracking
    name: Period Log And Cycle Estimation
    capability: Logs period status and details, shows recent period history, and estimates current cycle position and next period timing.
    status: partial
    approach: Uses a SwiftUI tracking screen backed by Core Data, storing status and supplemental period details in `PeriodEntry` fields and note strings, then infers cycles with date-gap heuristics.
    tech: [SwiftUI, CoreData, Foundation, JSONEncoder, JSONDecoder]
    io:
      in: selected date, on/off status, flow, symptom sliders, emotions, discharge, sexual activity, and notes
      out: persisted `PeriodEntry` records plus derived cycle-day and next-period estimates
    code_refs:
      - HealthTracker/PeriodTrackingView.swift
      - HealthTracker/CoreDataStack.swift
      - DesignSystem.swift
    known_gaps:
      - Emotions, discharge, sexual activity, and symptom detail are serialized into notes text instead of structured fields.
      - Cycle detection depends on string markers like `Status: On` and `Status: Off` inside notes.
      - Prediction logic falls back to a simple heuristic and does not model irregular cycles beyond coarse day-gap checks.
    match_keywords: [period tracker, menstrual cycle logging, cycle estimation, period diary, reproductive health tracking]

  - id: healthtracker.hormone-charts.hormone-reference-visualization
    project: HealthTracker
    subsystem: Hormone Charts
    name: Hormone Reference Visualization
    capability: Shows reference hormone curves across a 28-day cycle and overlays period-history-based cycle predictions.
    status: partial
    approach: Uses hard-coded hormone reference data and custom SwiftUI chart/calendar views, then estimates cycle context from saved period entries.
    tech: [SwiftUI, CoreData, Foundation]
    io:
      in: selected hormone type and recent `PeriodEntry` history
      out: hormone charts, cycle-phase explanations, and next-period/calendar predictions
    code_refs:
      - HealthTracker/HormoneChartView.swift
      - HealthTracker/CoreDataStack.swift
      - DesignSystem.swift
    known_gaps:
      - Hormone values are hard-coded reference data rather than measured user data or imported labs.
      - Predictions assume a simplified average-cycle model with a 28-day default.
      - Cycle inference again depends on note-string status markers from period entries.
    match_keywords: [hormone chart, cycle phase visualization, period prediction calendar, menstrual hormone reference, reproductive analytics]

  - id: healthtracker.history-reporting.history-analytics-and-export
    project: HealthTracker
    subsystem: History & Reporting
    name: History Analytics And Export
    capability: Aggregates stored entries into summaries, recent-history lists, delete actions, and CSV export output.
    status: partial
    approach: Fetches multiple Core Data entity types for a selected timeframe, computes lightweight in-memory stats, and exports a CSV through a share sheet.
    tech: [SwiftUI, CoreData, Foundation, UIKit]
    io:
      in: timeframe selection and stored daily, period, sleep, and lifestyle records
      out: history summaries, top-symptom statistics, deletion actions, and CSV files for sharing
    code_refs:
      - HealthTracker/HistoryView.swift
      - HealthTracker/CoreDataStack.swift
      - DesignSystem.swift
    known_gaps:
      - `selectedTimeframe` starts as `Last 7 Days` while the selectable options and date logic use `7 days`, `30 days`, `90 days`, and `All time`, so the default path falls into the catch-all branch.
      - Lifestyle analytics recover caffeine, water, and exercise labels by parsing notes text instead of using typed stored values directly.
      - High-stress-day counting checks for values `>= 7` even though the daily-entry stress slider uses a 0-5 range.
      - Mixed sleep-quality storage conventions make exported and summarized sleep quality values inconsistent.
    match_keywords: [health history dashboard, symptom analytics, csv export, trend reporting, personal health reports]

  - id: healthtracker.design-system.minimal-health-ui-kit
    project: HealthTracker
    subsystem: Design System
    name: Minimal Health UI Kit
    capability: Provides the shared visual tokens and reusable SwiftUI controls used across the app's tracking screens.
    status: working
    approach: Defines colors, typography, spacing, and reusable SwiftUI primitives such as cards, sliders, chips, collapsible sections, and modal helpers in a single shared file.
    tech: [SwiftUI, CoreData]
    io:
      in: view state and content closures from feature screens
      out: consistent UI composition, styling tokens, and reusable interaction components
    code_refs:
      - DesignSystem.swift
      - HealthTracker/ContentView.swift
      - HealthTracker/DailyTrackingView.swift
      - HealthTracker/PeriodTrackingView.swift
      - HealthTracker/HormoneChartView.swift
      - HealthTracker/HistoryView.swift
      - HealthTracker/SleepTrackingView.swift
    known_gaps:
      - The shared UI kit and many feature-specific helper views live together in one large file, which makes reuse and ownership coarse.
      - The design layer includes Core Data-aware helpers (`MinimalSymptomCategory`, `MinimalEditModal`) instead of staying purely presentational.
    match_keywords: [swiftui design system, reusable ui components, health app ui kit, design tokens, ios component library]
